<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Anime List — Sabinaya Sapkota</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root{
    --main-color:#f60b0b;
    --bg-color:#080808;
    --card-bg:#111111;
    --text-dim:#b8b8b8;
    --border:#2a2a2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-color);
    color:#fff;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    padding:50px 20px 80px;
  }
  .page-header{ text-align:center; margin-bottom:24px; }
  .page-header h1{
    font-size:2.4rem;
    font-weight:800;
    margin:0 0 10px;
    letter-spacing:.5px;
  }
  .page-header .underline{
    width:180px; height:4px; margin:0 auto;
    background:var(--main-color);
    border-radius:2px;
  }
  .page-header .subtitle{
    color:var(--text-dim);
    margin-top:12px;
    font-size:.95rem;
  }
  .page-header a{ color:var(--main-color); text-decoration:none; }
  .page-header a:hover{ text-decoration:underline; }
  .page-header .updated{
    color:#666; font-size:.8rem; margin-top:6px;
  }

  /* Stats strip */
  .stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
    max-width:1000px;
    margin:0 auto 30px;
  }
  .stat-pill{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px 18px;
    font-size:.85rem;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stat-pill b{ color:#fff; font-size:1rem; }
  .stat-pill.accent{ border-color:rgba(246,11,11,.4); }
  .stat-pill.accent b{ color:var(--main-color); }

  /* Controls: tabs + search + sort */
  .controls{
    max-width:1200px;
    margin:0 auto 34px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
    padding-bottom:16px;
  }
  .tab-btn{
    background:none; border:1px solid transparent; color:var(--text-dim);
    font-size:.88rem; cursor:pointer; padding:7px 14px;
    border-radius:20px;
    transition:all .15s ease;
    display:flex; align-items:center; gap:6px;
  }
  .tab-btn .count{
    background:rgba(255,255,255,.08);
    padding:1px 7px;
    border-radius:10px;
    font-size:.75rem;
  }
  .tab-btn.active{ color:#fff; font-weight:700; background:rgba(246,11,11,.15); border-color:rgba(246,11,11,.5); }
  .tab-btn.active .count{ background:var(--main-color); color:#fff; }
  .tab-btn:hover{ color:#fff; }

  .toolbar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .search-box{
    position:relative;
    width:100%;
    max-width:340px;
  }
  .search-box i{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--text-dim); font-size:.9rem;
  }
  .search-box input{
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--border);
    color:#fff;
    padding:10px 14px 10px 36px;
    border-radius:8px;
    font-size:.9rem;
    outline:none;
    transition:border-color .15s ease;
  }
  .search-box input:focus{ border-color:var(--main-color); }
  .search-box input::placeholder{ color:#777; }

  .sort-select{
    background:var(--card-bg);
    border:1px solid var(--border);
    color:#fff;
    padding:10px 14px;
    border-radius:8px;
    font-size:.9rem;
    outline:none;
    cursor:pointer;
  }
  .sort-select:focus{ border-color:var(--main-color); }

  .result-count{
    text-align:center;
    color:#666;
    font-size:.82rem;
    margin-top:-6px;
  }

  .status-msg{
    text-align:center; color:var(--text-dim);
    padding:40px 0; font-size:.95rem;
  }
  .status-msg i{ font-size:1.6rem; display:block; margin-bottom:10px; color:var(--main-color); }
  .status-msg a.retry{ color:var(--main-color); cursor:pointer; text-decoration:underline; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:26px;
    max-width:1200px;
    margin:0 auto;
  }

  .card{
    background:var(--card-bg);
    border:1.5px solid var(--main-color);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 22px rgba(246,11,11,.25);
  }
  .card .poster-wrap{ position:relative; }
  .card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
    background:#1a1a1a;
  }
  .score-chip{
    position:absolute;
    top:10px; right:10px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.15);
    color:#ffd23f;
    font-size:.78rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .score-chip i{ font-size:.72rem; }
  .card-body{ padding:16px 18px 18px; display:flex; flex-direction:column; flex:1; }
  .card-title{
    font-size:1.05rem;
    font-weight:800;
    margin:0 0 10px;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:2.6em;
  }
  .card-meta{ color:var(--text-dim); font-size:.9rem; margin:2px 0; }
  .card-meta b{ color:#eee; font-weight:600; }
  .badge-status{
    display:inline-block;
    margin-bottom:10px;
    padding:3px 10px;
    border-radius:20px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.4px;
    text-transform:uppercase;
    width:fit-content;
    background:rgba(246,11,11,.15);
    color:var(--main-color);
    border:1px solid rgba(246,11,11,.4);
  }
  .badge-status.completed{ background:rgba(70,200,120,.12); color:#5fd88a; border-color:rgba(70,200,120,.4); }
  .badge-status.on_hold{ background:rgba(240,180,40,.12); color:#f0c040; border-color:rgba(240,180,40,.4); }
  .badge-status.dropped{ background:rgba(150,150,150,.12); color:#999; border-color:rgba(150,150,150,.35); }
  .badge-status.plan_to_watch{ background:rgba(100,150,240,.12); color:#7ea6f0; border-color:rgba(100,150,240,.4); }

  .progress-track{
    height:5px;
    background:#222;
    border-radius:3px;
    overflow:hidden;
    margin:8px 0 10px;
  }
  .progress-fill{
    height:100%;
    background:var(--main-color);
    border-radius:3px;
  }

  .card-footer{ margin-top:auto; padding-top:12px; }
  .check-btn{
    display:block;
    text-align:center;
    background:#5c0a0a;
    color:#fff;
    text-decoration:none;
    padding:9px 0;
    border-radius:6px;
    font-size:.88rem;
    font-weight:600;
    border:1px solid var(--main-color);
    transition:background .2s ease;
  }
  .check-btn:hover{ background:var(--main-color); }

  footer{
    text-align:center; margin-top:60px;
    color:#555; font-size:.8rem;
  }
  footer a{ color:var(--main-color); text-decoration:none; }

  @media (max-width:480px){
    body{ padding:30px 14px 60px; }
    .page-header h1{ font-size:1.8rem; }
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>My Anime List</h1>
  <div class="underline"></div>
  <div class="subtitle">
    Live from <a href="https://myanimelist.net/profile/Sabinaya_Sapkota" target="_blank" rel="noopener">myanimelist.net/profile/Sabinaya_Sapkota</a>
  </div>
  <div class="updated" id="updatedAt"></div>
</div>

<div class="stats" id="stats"></div>

<div class="controls">
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-status="all">All <span class="count" id="count-all">0</span></button>
    <button class="tab-btn" data-status="watching">Watching <span class="count" id="count-watching">0</span></button>
    <button class="tab-btn" data-status="completed">Completed <span class="count" id="count-completed">0</span></button>
    <button class="tab-btn" data-status="on_hold">On Hold <span class="count" id="count-on_hold">0</span></button>
    <button class="tab-btn" data-status="dropped">Dropped <span class="count" id="count-dropped">0</span></button>
    <button class="tab-btn" data-status="plan_to_watch">Plan to Watch <span class="count" id="count-plan_to_watch">0</span></button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Search titles…">
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="title">Sort: Title (A–Z)</option>
      <option value="score">Sort: Score (high–low)</option>
      <option value="progress">Sort: Progress (most watched)</option>
      <option value="remaining">Sort: Fewest episodes left</option>
    </select>
  </div>

  <div class="result-count" id="resultCount"></div>
</div>

<div id="content">
  <div class="status-msg" id="statusMsg">
    <i class="bi bi-hourglass-split"></i>
    Loading anime list…
  </div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  Synced hourly from MyAnimeList ·
  <a href="https://myanimelist.net/profile/Sabinaya_Sapkota" target="_blank" rel="noopener">View full profile on MyAnimeList</a>
</footer>

<script>
const USERNAME = "Sabinaya_Sapkota";
const DATA_URL = "./data/anime.json"; // filled in daily by the GitHub Action

const statusLabels = {
  watching: "Watching",
  completed: "Completed",
  on_hold: "On Hold",
  dropped: "Dropped",
  plan_to_watch: "Plan to Watch"
};

const grid = document.getElementById("grid");
const statusMsg = document.getElementById("statusMsg");
const tabs = document.getElementById("tabs");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");
const resultCount = document.getElementById("resultCount");
const statsEl = document.getElementById("stats");
const updatedAtEl = document.getElementById("updatedAt");

let currentTab = "all";
let currentQuery = "";
let currentSort = "title";
let allEntries = null; // cached after first successful load

tabs.addEventListener("click", (e) => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.dataset.status;
  render();
});

searchInput.addEventListener("input", (e) => {
  currentQuery = e.target.value.trim().toLowerCase();
  render();
});

sortSelect.addEventListener("change", (e) => {
  currentSort = e.target.value;
  render();
});

function showMessage(html) {
  statusMsg.innerHTML = html;
  statusMsg.style.display = "block";
  grid.innerHTML = "";
  resultCount.textContent = "";
}

function placeholderImg() {
  return "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='420'><rect width='300' height='420' fill='#1a1a1a'/><text x='50%' y='50%' fill='#555' font-size='16' text-anchor='middle' dy='.3em' font-family='sans-serif'>No image</text></svg>`
  );
}

function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function cardHTML(entry) {
  const statusLabel = statusLabels[entry.status] || (entry.status || "").replace(/_/g, " ") || "??";
  const watched = entry.episodes_watched ?? 0;
  const total = entry.episodes_total || 0;
  const pct = total > 0 ? Math.min(100, Math.round((watched / total) * 100)) : 0;
  const scoreVal = entry.score && entry.score > 0 ? entry.score : null;
  const img = entry.image || placeholderImg();
  const url = entry.url || `https://myanimelist.net/profile/${USERNAME}`;
  const title = escapeHtml(entry.title || "Untitled");

  return `
    <div class="card">
      <div class="poster-wrap">
        <img src="${img}" alt="${title}" loading="lazy" onerror="this.src='${placeholderImg()}'">
        ${scoreVal ? `<div class="score-chip"><i class="bi bi-star-fill"></i>${scoreVal}</div>` : ""}
      </div>
      <div class="card-body">
        <span class="badge-status ${entry.status || ''}">${statusLabel}</span>
        <h3 class="card-title">${title}</h3>
        <div class="card-meta"><b>Episodes:</b> ${watched}/${total || "?"}</div>
        ${total > 0 ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : `<div class="progress-track"></div>`}
        <div class="card-footer">
          <a class="check-btn" href="${url}" target="_blank" rel="noopener">Check it out</a>
        </div>
      </div>
    </div>
  `;
}

function updateCounts() {
  const counts = { all: allEntries.length, watching: 0, completed: 0, on_hold: 0, dropped: 0, plan_to_watch: 0 };
  allEntries.forEach(e => { if (counts[e.status] !== undefined) counts[e.status]++; });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById(`count-${k}`);
    if (el) el.textContent = counts[k];
  });
}

function renderStats() {
  const total = allEntries.length;
  const completed = allEntries.filter(e => e.status === "completed").length;
  const totalEpisodes = allEntries.reduce((sum, e) => sum + (e.episodes_watched || 0), 0);
  const scored = allEntries.filter(e => e.score && e.score > 0);
  const avgScore = scored.length ? (scored.reduce((s, e) => s + e.score, 0) / scored.length).toFixed(1) : "—";

  statsEl.innerHTML = `
    <div class="stat-pill accent"><b>${total}</b> titles</div>
    <div class="stat-pill"><b>${completed}</b> completed</div>
    <div class="stat-pill"><b>${totalEpisodes.toLocaleString()}</b> episodes watched</div>
    <div class="stat-pill"><b>${avgScore}</b> avg score</div>
  `;
}

function renderUpdatedAt(unixSeconds) {
  if (!unixSeconds) { updatedAtEl.textContent = ""; return; }
  const d = new Date(unixSeconds * 1000);
  updatedAtEl.textContent = "Last synced " + d.toLocaleString(undefined, {
    dateStyle: "medium", timeStyle: "short"
  });
}

function sortEntries(items) {
  const arr = [...items];
  switch (currentSort) {
    case "score":
      arr.sort((a, b) => (b.score || 0) - (a.score || 0) || (a.title || "").localeCompare(b.title || ""));
      break;
    case "progress":
      arr.sort((a, b) => (b.episodes_watched || 0) - (a.episodes_watched || 0));
      break;
    case "remaining":
      arr.sort((a, b) => {
        const remA = (a.episodes_total || 0) - (a.episodes_watched || 0);
        const remB = (b.episodes_total || 0) - (b.episodes_watched || 0);
        // entries with unknown totals go last
        if (!a.episodes_total) return 1;
        if (!b.episodes_total) return -1;
        return remA - remB;
      });
      break;
    case "title":
    default:
      arr.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  }
  return arr;
}

function render() {
  if (!allEntries) return;

  let items = currentTab === "all" ? allEntries : allEntries.filter(e => e.status === currentTab);
  if (currentQuery) {
    items = items.filter(e => (e.title || "").toLowerCase().includes(currentQuery));
  }
  items = sortEntries(items);

  if (!items.length) {
    showMessage(`<i class="bi bi-emoji-neutral"></i> Nothing matches here.`);
    return;
  }
  statusMsg.style.display = "none";
  grid.innerHTML = items.map(cardHTML).join("");
  resultCount.textContent = `Showing ${items.length} of ${allEntries.length}`;
}

async function loadList() {
  showMessage(`<i class="bi bi-hourglass-split"></i> Loading anime list…`);

  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} fetching ${DATA_URL}`);
    const json = await res.json();

    allEntries = json.entries || [];
    updateCounts();
    renderStats();
    renderUpdatedAt(json.updated_at);
    render();
  } catch (err) {
    console.error(err);
    showMessage(`
      <i class="bi bi-exclamation-triangle"></i>
      Couldn't load <code>data/anime.json</code>.<br>
      <span style="font-size:.82rem;opacity:.85;">${(err.message || "unknown error").toString().slice(0,180)}</span><br><br>
      Make sure the GitHub Action has run at least once (Actions tab → "Update anime list" → Run workflow)
      so <code>data/anime.json</code> exists in the repo.<br><br>
      <a class="retry" onclick="loadList()">Try again</a>
      &nbsp;·&nbsp;
      <a href="https://myanimelist.net/profile/${USERNAME}" target="_blank" rel="noopener">View on MyAnimeList</a>
    `);
  }
}

loadList();
</script>

</body>
</html>
